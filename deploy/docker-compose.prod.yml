# Production stack for one VPS: Caddy (HTTPS + web app), API, worker, PostgreSQL.
# Not yet run in this repository's environment; follow Backend/docs/DEPLOYMENT.md.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: madarsa
      POSTGRES_USER: madarsa_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madarsa_owner -d madarsa"]
      interval: 10s
      retries: 10

  migrate:
    build: ../Backend
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    env_file: .env.production
    environment:
      # Migrations run as the owner; the app uses a restricted role (see DEPLOYMENT.md).
      DATABASE_URL: postgresql://madarsa_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/madarsa
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ../Backend
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ../Backend
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/web:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  storage:
  caddy_data:
